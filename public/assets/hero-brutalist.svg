<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" font-family="Georgia, 'Frank Ruhl Libre', serif">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.10
                                           0 0 0 0 0.09
                                           0 0 0 0 0.08
                                           0 0 0 0.08 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <pattern id="halftone" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#1A1816"/>
    </pattern>
  </defs>

  <!-- 1 · cream paper -->
  <rect width="1920" height="1080" fill="#F5EFE3"/>

  <!-- 2 · grain overlay -->
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.55"/>

  <!-- 3 · construction grid -->
  <g stroke="#1A1816" stroke-width="1" opacity="0.07">
    <line x1="160"  y1="0" x2="160"  y2="1080"/>
    <line x1="320"  y1="0" x2="320"  y2="1080"/>
    <line x1="480"  y1="0" x2="480"  y2="1080"/>
    <line x1="640"  y1="0" x2="640"  y2="1080"/>
    <line x1="800"  y1="0" x2="800"  y2="1080"/>
    <line x1="960"  y1="0" x2="960"  y2="1080"/>
    <line x1="1120" y1="0" x2="1120" y2="1080"/>
    <line x1="1280" y1="0" x2="1280" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
    <line x1="1760" y1="0" x2="1760" y2="1080"/>
    <line x1="0" y1="135" x2="1920" y2="135"/>
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="405" x2="1920" y2="405"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="675" x2="1920" y2="675"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="0" y1="945" x2="1920" y2="945"/>
  </g>

  <!-- 4 · trim border -->
  <rect x="22" y="22" width="1876" height="1036" fill="none" stroke="#1A1816" stroke-width="2"/>

  <!-- 5 · registration crosses -->
  <g stroke="#1A1816" stroke-width="2" fill="none">
    <line x1="62" y1="80" x2="98" y2="80"/>
    <line x1="80" y1="62" x2="80" y2="98"/>
    <circle cx="80" cy="80" r="10"/>
    <line x1="1822" y1="80" x2="1858" y2="80"/>
    <line x1="1840" y1="62" x2="1840" y2="98"/>
    <circle cx="1840" cy="80" r="10"/>
  </g>

  <!-- 6 · MASSIVE Hebrew word — anchored bottom-right -->
  <text x="1860" y="900"
        font-weight="900"
        font-size="540" letter-spacing="-30" fill="#1A1816"
        text-anchor="end" direction="ltr">רבעון</text>

  <!-- 7 · oxblood architectural block (left) -->
  <rect x="180" y="280" width="320" height="540" fill="#933624"/>
  <rect x="208" y="308" width="264" height="484" fill="none" stroke="#F5EFE3" stroke-width="2"/>
  <text x="468" y="345" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="600"
        fill="#F5EFE3" letter-spacing="4" text-anchor="end">VOL · 01 · MMXXVI</text>
  <text x="468" y="780" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="600"
        fill="#F5EFE3" letter-spacing="4" text-anchor="end">PRESS · TEL AVIV</text>
  <text x="340" y="640" font-weight="900"
        font-size="260" fill="#F5EFE3" text-anchor="middle" letter-spacing="-8">01</text>
  <line x1="208" y1="680" x2="472" y2="680" stroke="#F5EFE3" stroke-width="1"/>
  <text x="340" y="725" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11" font-weight="500"
        fill="#F5EFE3" letter-spacing="6" text-anchor="middle">QUARTERLY</text>

  <!-- 8 · vertical numbered markers, left rail -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#1A1816" letter-spacing="3" font-weight="600">
    <text x="50" y="160">§ 01</text>
    <line x1="50" y1="172" x2="120" y2="172" stroke="#1A1816" stroke-width="1"/>
    <text x="50" y="200">§ 02</text>
    <line x1="50" y1="212" x2="120" y2="212" stroke="#1A1816" stroke-width="1"/>
    <text x="50" y="240">§ 03</text>
    <line x1="50" y1="252" x2="120" y2="252" stroke="#1A1816" stroke-width="1"/>
    <text x="50" y="280">§ 04</text>
    <line x1="50" y1="292" x2="120" y2="292" stroke="#1A1816" stroke-width="1"/>
    <text x="50" y="320">§ 05</text>
    <line x1="50" y1="332" x2="120" y2="332" stroke="#1A1816" stroke-width="1"/>
  </g>

  <!-- 9 · top-section title block -->
  <g>
    <line x1="600" y1="160" x2="1300" y2="160" stroke="#1A1816" stroke-width="3"/>
    <text x="600" y="195" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13"
          fill="#1A1816" letter-spacing="6" font-weight="600">SECTION § 01 — DOSSIER</text>
    <text x="600" y="278" font-size="76"
          fill="#1A1816" font-weight="700">Quarterly Report</text>
    <text x="600" y="335" font-size="42"
          fill="#933624" font-style="italic" font-weight="400" direction="ltr">דו״ח רבעוני · 2026</text>
    <line x1="600" y1="360" x2="900" y2="360" stroke="#1A1816" stroke-width="1"/>
    <text x="600" y="392" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12"
          fill="#1A1816" letter-spacing="3">FILED · TEL AVIV · APR · MMXXVI</text>
  </g>

  <!-- 10 · diagonal stripe (-22°) -->
  <g transform="rotate(-22 960 540)">
    <rect x="-300" y="535" width="2520" height="6" fill="#1A1816"/>
    <rect x="-300" y="555" width="2520" height="2" fill="#1A1816" opacity="0.45"/>
    <rect x="-300" y="565" width="2520" height="2" fill="#1A1816" opacity="0.25"/>
  </g>

  <!-- 11 · halftone band (top-center) -->
  <rect x="780" y="100" width="280" height="48" fill="url(#halftone)"/>
  <rect x="780" y="148" width="280" height="2" fill="#1A1816"/>

  <!-- 12 · stamp seal (oxblood, mid-right) -->
  <g transform="translate(1480 460)">
    <circle r="115" fill="none" stroke="#933624" stroke-width="4"/>
    <circle r="100" fill="none" stroke="#933624" stroke-width="1"/>
    <g stroke="#933624" stroke-width="1" fill="none">
      <line x1="-14" y1="0" x2="14" y2="0"/>
      <line x1="0" y1="-14" x2="0" y2="14"/>
    </g>
    <text font-size="48" fill="#933624"
          text-anchor="middle" font-weight="900" y="-22" direction="ltr">חתום</text>
    <text font-size="48" fill="#933624"
          text-anchor="middle" font-weight="900" y="40" direction="ltr">ומאומת</text>
    <path id="stampArcTop" d="M -85 0 A 85 85 0 0 1 85 0" fill="none"/>
    <text font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11" fill="#933624"
          letter-spacing="3" font-weight="600">
      <textPath href="#stampArcTop" startOffset="50%" text-anchor="middle">CERTIFIED · MMXXVI</textPath>
    </text>
  </g>

  <!-- 13 · chunky shekel sign -->
  <text x="1100" y="990" font-family="'Heebo', system-ui, sans-serif" font-weight="900"
        font-size="220" fill="#933624" text-anchor="middle">₪</text>

  <!-- 14 · folio strip on right -->
  <line x1="1740" y1="120" x2="1740" y2="380" stroke="#1A1816" stroke-width="1"/>
  <text x="1755" y="140" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11"
        fill="#1A1816" letter-spacing="3" font-weight="600">FOLIO 01</text>
  <text x="1755" y="370" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11"
        fill="#1A1816" letter-spacing="3" font-weight="600">END §</text>

  <!-- 15 · bottom black band -->
  <rect x="0" y="985" width="1920" height="95" fill="#1A1816"/>
  <rect x="0" y="985" width="1920" height="2" fill="#933624"/>
  <text x="80" y="1042" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="18"
        fill="#F5EFE3" letter-spacing="6" font-weight="500"
        text-anchor="start">Q2 · 2026 · BUSINESS QUARTERLY</text>
  <text x="1840" y="1042" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="18"
        fill="#F5EFE3" letter-spacing="6" font-weight="500"
        text-anchor="end">EDITION · 01</text>
  <circle cx="960" cy="1032" r="3" fill="#F5EFE3"/>
  <line x1="900" y1="1032" x2="950" y2="1032" stroke="#F5EFE3" stroke-width="1" opacity="0.5"/>
  <line x1="970" y1="1032" x2="1020" y2="1032" stroke="#F5EFE3" stroke-width="1" opacity="0.5"/>

  <!-- 16 · architectural corner brackets bottom -->
  <g stroke="#1A1816" stroke-width="3" fill="none">
    <path d="M 60 920 L 60 960 L 100 960"/>
    <path d="M 1860 920 L 1860 960 L 1820 960"/>
  </g>
</svg>
